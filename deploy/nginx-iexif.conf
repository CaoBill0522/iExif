# iExif 官网 Nginx 配置示例。把 example.com 换成你的域名，
# 把证书路径和 fastcgi_pass 换成服务器上的实际值。

server {
    listen 80;
    server_name example.com;
    # 申请/续期证书时的域名验证
    location ^~ /.well-known/ { root /var/www/iexif; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/iexif;
    index index.php;
    error_page 404 /404.php;
    charset utf-8;

    # 内部文件不对外开放（.well-known 除外）
    location ^~ /.well-known/ { try_files $uri =404; }
    location ^~ /inc/ { return 404; }
    location ~ /\. { return 404; }
    location ~ \.(md|log|ini|sh)$ { return 404; }

    location = /robots.txt  { rewrite ^ /robots.php last; }
    location = /sitemap.xml { rewrite ^ /sitemap.php last; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param IEXIF_SITE_URL https://example.com;
        # 按服务器上的 PHP 版本修改，例如 unix:/run/php/php8.3-fpm.sock
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location ~* \.(css|js|jpg|png|svg)$ { expires 30d; access_log off; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
}
